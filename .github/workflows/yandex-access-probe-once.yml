name: One-time Yandex project credential probe

on:
  push:
    branches: [main]
    paths: ['.github/workflows/yandex-access-probe-once.yml']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      YANDEX_API_KEY: ${{ secrets.YANDEX_API_KEY }}
      YAIS_API: ${{ secrets.YAIS_API }}
      YANDEX_FOLDER_ID: ${{ secrets.YANDEX_FOLDER_ID }}
      YAIS_FOLDER_ID: ${{ secrets.YAIS_FOLDER_ID }}
      YANDEX_WEBMASTER_OAUTH_TOKEN: ${{ secrets.YANDEX_WEBMASTER_OAUTH_TOKEN }}
      YANDEX_WEBMASTER_TOKEN: ${{ secrets.YANDEX_WEBMASTER_TOKEN }}
      YANDEX_OAUTH_TOKEN: ${{ secrets.YANDEX_OAUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: conradipui-glitch/yaai
          path: yaai
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check credentials and Webmaster authorization (no export)
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { createWebmasterClient, webmasterOAuthToken } from './yaai/lib/webmaster.mjs';
          console.log(`wordstat_api_key_present=${Boolean(process.env.YANDEX_API_KEY || process.env.YAIS_API)}`);
          console.log(`wordstat_folder_present=${Boolean(process.env.YANDEX_FOLDER_ID || process.env.YAIS_FOLDER_ID)}`);
          const availableToken = Boolean(webmasterOAuthToken());
          console.log(`webmaster_oauth_secret_present=${availableToken}`);
          if (availableToken) {
            const client = createWebmasterClient();
            try {
              const user = await client.user();
              console.log('webmaster_oauth_accepted=true');
              const response = await client.hosts(user.user_id);
              const verified = (response.hosts || []).filter((item) => item.verified === true);
              const target = verified.filter((item) => item.ascii_host_url && new URL(item.ascii_host_url).host === 'conradipui-glitch.github.io');
              console.log(`silalesa_host_verified=${target.length === 1}`);
              console.log(`verified_site_count=${verified.length}`);
              if (target.length === 1) {
                const [limits, dates] = await Promise.all([client.limits(user.user_id, target[0].host_id), client.dates(user.user_id, target[0].host_id)]);
                const entries = Array.isArray(dates.dates) ? dates.dates : [];
                console.log(`available_dates=${entries.length}`);
                console.log(`newest_date=${entries.length ? [...entries].sort().at(-1) : 'none'}`);
                console.log(`limit_categories=${Array.isArray(limits.limits) ? limits.limits.length : 0}`);
              }
            } catch (error) {
              console.error(`webmaster_probe_error=${String(error.message).match(/HTTP \d+/)?.[0] || 'API or access error'}`);
              process.exitCode = 1;
            }
          }
          NODE
