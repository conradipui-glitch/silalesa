name: One-time P01 process and estimate verification
on:
  push:
    branches: [content/p01-interactive-process-estimate-20260918]
    paths: ['.github/workflows/complete-p01-once.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Integrate P01 without altering article or media
        run: python3 scripts/.integrate-p01-once.py
      - name: Install locked dependencies
        run: npm ci
      - name: Check TypeScript
        run: npx tsc --noEmit
      - name: Build and prerender
        run: npm run build
      - name: Test both processes, estimate cases and published content
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { pathToFileURL } from 'node:url';
          import { createElement } from 'react';
          import { renderToStaticMarkup } from 'react-dom/server';
          import { build } from 'esbuild';
          const temp = '.p01-visual-test.mjs';
          try {
            await build({ entryPoints: ['src/components/PlasterProcessGuide.tsx'], bundle: true, platform: 'node', format: 'esm', packages: 'external', outfile: temp, logLevel: 'silent' });
            const { estimateItems, summarizeOffers, PlasterProcessGuide } = await import(pathToFileURL(path.resolve(temp)).href);
            assert.equal(estimateItems.length, 8);
            const offers = (machine, hand) => Object.fromEntries(estimateItems.map(({id}) => [id, {machine, hand}]));
            const unknown = summarizeOffers(offers('unknown', 'unknown'), [false, false, false]);
            assert.equal(unknown.clarified, 0);
            assert.equal(unknown.unresolved.length, 8);
            assert.equal(unknown.baselineMissing, 3);
            assert.equal(unknown.ready, false);
            const included = offers('included', 'included');
            const full = summarizeOffers(included, [true, true, true]);
            assert.equal(full.clarified, 8);
            assert.equal(full.unresolved.length, 0);
            assert.equal(full.ready, true);
            assert.equal(summarizeOffers(included, [true, false, true]).ready, false);
            const missing = summarizeOffers({...included, [estimateItems[0].id]: {machine:'unknown', hand:'included'}}, [true, true, true]);
            assert.equal(missing.unresolved.length, 1);
            assert.equal(missing.ready, false);
            const different = summarizeOffers({...included, [estimateItems[1].id]: {machine:'separate', hand:'included'}}, [true, true, true]);
            assert.equal(different.different.length, 1);
            assert.equal(different.separate.length, 1);
            assert.equal(different.ready, false);
            const extra = summarizeOffers({...included, [estimateItems[1].id]: {machine:'separate', hand:'separate'}}, [true, true, true]);
            assert.equal(extra.different.length, 0);
            assert.equal(extra.separate.length, 1);
            assert.equal(extra.ready, false);
            const rendered = renderToStaticMarkup(createElement(PlasterProcessGuide));
            for (const text of ['Две технологии. Пять этапов.', 'Две сметы: что действительно включено?', 'Сбросить отметки', 'aria-live="polite"', 'aria-pressed="true"', 'role="progressbar"', 'Не указано в смете', 'Ручная']) assert.ok(rendered.includes(text), `Missing UI/a11y content: ${text}`);
            assert.equal((rendered.match(/aria-controls="p01-stage-detail"/g) || []).length, 5);
            assert.equal((rendered.match(/<select /g) || []).length, 16);
            const slug = 'guides/remont/mehanizirovannaya-ili-ruchnaya-shtukaturka';
            const html = fs.readFileSync(`dist/${slug}/index.html`, 'utf8');
            const service = fs.readFileSync('dist/mehanizirovannaya-shtukaturka-omsk/index.html', 'utf8');
            const sitemap = fs.readFileSync('dist/sitemap.xml', 'utf8');
            const landing = fs.readFileSync('src/pages/SeoLandingPage.tsx', 'utf8');
            const article = JSON.parse(fs.readFileSync('src/data/seo-page-guides-plaster.json', 'utf8'));
            assert.equal(article.filter(item => item.slug === slug).length, 1);
            for (const text of ['Карта нанесения и проверки смет штукатурки', 'Матрица сравнения смет', 'пяти этапов', 'Грунтование', 'Приёмка']) assert.ok(html.includes(text), `Missing static fallback: ${text}`);
            assert.ok(html.includes(`rel="canonical" href="https://conradipui-glitch.github.io/silalesa/${slug}/"`));
            assert.ok(sitemap.includes(`${slug}/`));
            assert.ok(service.includes(`${slug}/`));
            assert.ok(html.includes('mehanizirovannaya-shtukaturka-omsk/'));
            assert.ok(landing.includes('isPlasterGuide && <PlasterProcessGuide />'));
            for (const oldSlug of ['guides/remont/polusuhaya-ili-mokraya-styazhka', 'guides/remont/shtukaturka-ili-styazhka-chto-snachala', 'guides/remont/gipsovaya-ili-tsementnaya-shtukaturka']) assert.ok(fs.readFileSync(`dist/${oldSlug}/index.html`, 'utf8').includes('rel="canonical"'), `Existing guide lost: ${oldSlug}`);
            console.log('PASS: P01 SSR, five-stage selectors, 16 scope fields, six estimate cases, static diagram, SEO and existing guides');
          } finally { fs.rmSync(temp, {force:true}); }
          JS
      - name: Verify limited changes and commit tested integration
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git', 'diff', '--name-only'], text=True).splitlines())
          expected = {'src/pages/SeoLandingPage.tsx', 'scripts/prerender.mjs', 'docs/content-research/guide-visual-standard.md', 'docs/MASTER-EXECUTION-PLAN.md'}
          assert changed == expected, f'Unexpected changed files: {changed ^ expected}'
          assert not any('serviceMedia' in item or 'BeforeAfter' in item for item in changed)
          print('Only intended source files changed:', ', '.join(sorted(changed)))
          PY
          git add src/pages/SeoLandingPage.tsx scripts/prerender.mjs docs/content-research/guide-visual-standard.md docs/MASTER-EXECUTION-PLAN.md
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: integrate P01 interactive process and estimate comparison'
          git push origin HEAD:${GITHUB_REF_NAME}
