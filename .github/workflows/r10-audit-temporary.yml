name: Run R10 full acceptance audit

on:
  push:
    branches: ["revision/r10-final-acceptance"]
    paths: [".github/workflows/r10-audit-temporary.yml"]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Build every route with prior regressions
        run: |
          npm ci
          npm run build
      - name: Audit final static pages, links, meta, print and aliases
        run: node scripts/check-r10.mjs
      - name: Probe currently published main using real HTTP
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, pathlib, re, json
          base='https://conradipui-glitch.github.io/silalesa/'
          urls=re.findall(r'<loc>(.*?)</loc>',pathlib.Path('dist/sitemap.xml').read_text())
          ids=re.findall(r'id: "(\d+)"',pathlib.Path('src/data/products.ts').read_text())[:7]
          urls.extend(base+'product/'+x+'/' for x in ids)
          urls.extend([base+'robots.txt',base+'sitemap.xml',base+'llms.txt'])
          results=[]
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (Silalesa R10 public acceptance)'})
              with urllib.request.urlopen(req,timeout=15) as response:
                body=response.read(120000).decode('utf-8','replace')
                results.append({'url':url,'http':response.status,'html': 'text/html' in response.headers.get('Content-Type',''),'body':body})
            except Exception as exc:
              results.append({'url':url,'error':str(exc)})
          for result in results:
            print(json.dumps({k:v for k,v in result.items() if k!='body'},ensure_ascii=False))
          print('HTTP_SUMMARY',json.dumps({'checked':len(results),'success':sum(r.get('http')==200 for r in results),'failed':[r['url'] for r in results if r.get('http')!=200],'staticReadable':sum('data-prerendered="true"' in r.get('body','') for r in results)},ensure_ascii=False))
          PY
      - name: Remove temporary audit workflow after code check passed
        run: |
          git rm -f .github/workflows/r10-audit-temporary.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'R10: preserve audit script and remove temporary runner'
          git push origin HEAD:revision/r10-final-acceptance
