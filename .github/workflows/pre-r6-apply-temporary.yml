name: Apply pre-R6 technical fixes

on:
  push:
    branches: ["revision/pre-r6-url-address-trust"]
    paths:
      - ".github/workflows/pre-r6-apply-temporary.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Align guarded source patch and regression
        run: |
          sed -i "s@'to={productUrl}', 2)@'to={productUrl}', 3)@" scripts/apply-pre-r6-temporary.py
          sed -i "s@=== 2, 'Home cards@=== 3, 'Home cards@" scripts/check-pre-r6.mjs
          sed -i "s@filename.name != 'apply-pre-r6-temporary.py'@filename.name not in ('apply-pre-r6-temporary.py', 'check-pre-r6.mjs')@" scripts/apply-pre-r6-temporary.py
          grep -F "'to={productUrl}', 3)" scripts/apply-pre-r6-temporary.py
          grep -F "filename.name not in" scripts/apply-pre-r6-temporary.py
      - name: Apply guarded public fixes
        run: python3 scripts/apply-pre-r6-temporary.py
      - name: Wire regression into build
        run: python3 scripts/pre-r6-package-temporary.py
      - name: Install dependencies
        run: npm ci
      - name: Build and run R1–R5 and pre-R6 regressions
        run: npm run build
      - name: Remove temporary helpers and commit verified changes
        run: |
          git rm scripts/apply-pre-r6-temporary.py scripts/pre-r6-package-temporary.py .github/workflows/pre-r6-apply-temporary.yml
          git add package.json index.html src/data/products.ts src/components/Brand.tsx src/sections/ServicesAbout.tsx src/sections/Models.tsx scripts/prerender.mjs scripts/check-pre-r6.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --cached --check
          git commit -m "Fix numeric product aliases, remove obsolete address and publish factual trust details"
          git push origin HEAD:revision/pre-r6-url-address-trust
