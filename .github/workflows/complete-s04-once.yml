name: One-time S04 renovation sequence verification
on:
  push:
    branches: [content/s04-interactive-renovation-route-20260918]
    paths: ['.github/workflows/complete-s04-once.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Connect S04 timeline, preserve other guides and media
        run: |
          python3 scripts/.integrate-s04-once.py
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/components/RenovationSequenceGuide.tsx')
          data = p.read_text(encoding='utf-8')
          old = 'function makeSteps(route: Route, ceiling: boolean, heated: boolean, wetZone: boolean): Step[] {'
          assert data.count(old) == 1, 'Expected exactly one pure route builder'
          p.write_text(data.replace(old, 'export ' + old, 1), encoding='utf-8', newline='\n')
          PY
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Build and prerender
        run: npm run build
      - name: Check content, all scenario combinations, accessible controls and SEO
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { createRequire } from 'node:module';
          import * as esbuild from 'esbuild';
          const require = createRequire(import.meta.url);
          const slug = 'guides/remont/shtukaturka-ili-styazhka-chto-snachala';
          const html = fs.readFileSync(`dist/${slug}/index.html`, 'utf8');
          const source = fs.readFileSync('src/pages/SeoLandingPage.tsx', 'utf8');
          const visual = fs.readFileSync('src/components/RenovationSequenceGuide.tsx', 'utf8');
          const original = JSON.parse(fs.readFileSync('src/data/seo-page-guides-remont.json', 'utf8'));
          assert.equal(original.filter(page => page.slug === slug).length, 1, 'No duplicate guide');
          assert.match(html, /<h1>Штукатурка или стяжка: что делать сначала/);
          for (const marker of ['Карта очередности ремонта', 'Типовой маршрут с мокрой штукатуркой', 'Если стяжка уже готова', 'Если вместо мокрой штукатурки — гипсокартон', 'Частые вопросы']) assert.ok(html.includes(marker), `Prerender missing ${marker}`);
          assert.ok(html.includes(`rel="canonical" href="https://conradipui-glitch.github.io/silalesa/${slug}/"`));
          assert.ok(fs.readFileSync('dist/sitemap.xml', 'utf8').includes(`${slug}/`));
          for (const service of ['mehanizirovannaya-shtukaturka-omsk', 'polusuhaya-styazhka-omsk']) {
            const serviceHtml = fs.readFileSync(`dist/${service}/index.html`, 'utf8');
            assert.ok(serviceHtml.includes(`${slug}/`), `Reciprocal link missing from ${service}`);
            assert.ok(html.includes(`${service}/`), `S04 to service link missing: ${service}`);
          }
          for (const name of ['guides/remont/polusuhaya-ili-mokraya-styazhka', 'guides/remont/gipsovaya-ili-tsementnaya-shtukaturka']) assert.ok(fs.existsSync(`dist/${name}/index.html`), `${name} preserved`);
          assert.ok(source.includes('isRepairGuide && <RenovationSequenceGuide />'), 'S04 mounting');
          assert.ok(source.includes('isScreedGuide && <ScreedComparisonGuide />'), 'S01 retained');
          for (const marker of ['aria-pressed', 'aria-live="polite"', 'fieldset', 'focus-visible:outline', 'type="checkbox"', 'setActive', 'StepDetail', 'wet-first', 'screed-ready', 'dry-lining']) assert.ok(visual.includes(marker), `Interaction or access marker missing: ${marker}`);
          const tmp = 'scripts/.s04-contract-test.cjs';
          try {
            esbuild.buildSync({ entryPoints: ['src/components/RenovationSequenceGuide.tsx'], outfile: tmp, bundle: true, platform: 'node', format: 'cjs', external: ['react'] });
            const { makeSteps, RenovationSequenceGuide } = require(path.resolve(tmp));
            const React = require('react');
            const { renderToStaticMarkup } = require('react-dom/server');
            const initial = renderToStaticMarkup(React.createElement(RenovationSequenceGuide));
            assert.ok(initial.includes('Интерактивная схема'), 'SSR component');
            assert.ok(initial.includes('Штукатурка → основание → стяжка'), 'Default route visible');
            for (const route of ['wet-first', 'screed-ready', 'dry-lining']) for (const ceiling of [true, false]) for (const heated of [true, false]) for (const wetZone of [true, false]) {
              const steps = makeSteps(route, ceiling, heated, wetZone);
              assert.ok(steps.length >= 5, `Incomplete route ${route}`);
              assert.equal(new Set(steps.map(step => step.id)).size, steps.length, 'Unique stages');
              for (const step of steps) assert.ok(step.title && step.summary && step.checks.length > 0 && step.handoff, 'Every stage has purpose, checks and handoff');
              const all = JSON.stringify(steps);
              if (heated) assert.match(all, /тёплого пола/, 'Heated floor branch');
              if (wetZone) assert.match(all, /гидроизоляц/, 'Wet zone branch');
              if (route === 'wet-first') assert.equal(steps.some(step => step.id === 'plaster'), true, 'Wet plaster stage');
              if (route === 'screed-ready') assert.equal(steps.some(step => step.id === 'protection'), true, 'Protect existing screed');
              if (route === 'dry-lining') assert.equal(steps.some(step => step.id === 'lining'), true, 'Dry lining stage');
            }
          } finally { if (fs.existsSync(tmp)) fs.unlinkSync(tmp); }
          for (const forbidden of ['гарантированно быстрее', 'всегда дешевле', 'стяжка готова за 24 часа']) assert.ok(!visual.includes(forbidden), `Unverified promise ${forbidden}`);
          console.log('S04: 24 scenario variations, SSR, controls, HTML, canonical, sitemap, mutual links, existing guides PASS');
          JS
      - name: Verify scoped source changes and commit
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess
          paths = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          expected = {'src/components/RenovationSequenceGuide.tsx', 'src/pages/SeoLandingPage.tsx', 'scripts/prerender.mjs', 'docs/content-research/guide-visual-standard.md', 'docs/MASTER-EXECUTION-PLAN.md'}
          assert paths == expected, f'Unexpected changes: {paths ^ expected}'
          print('Source scope:', ', '.join(sorted(paths)))
          PY
          git add src/components/RenovationSequenceGuide.tsx src/pages/SeoLandingPage.tsx scripts/prerender.mjs docs/content-research/guide-visual-standard.md docs/MASTER-EXECUTION-PLAN.md
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: integrate S04 scenario-based renovation timeline and static diagram'
          git push origin HEAD:${GITHUB_REF_NAME}
