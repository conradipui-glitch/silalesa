name: One-time S01 visual guide integration
on:
  push:
    branches: [content/s01-interactive-comparison-20260918]
    paths: ['.github/workflows/complete-s01-once.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Connect S01 visual without altering existing media
        run: python3 scripts/.integrate-s01-once.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build and prerender
        run: npm run build
      - name: Validate interactive module, static content and existing page links
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const slug = 'guides/remont/polusuhaya-ili-mokraya-styazhka';
          const html = fs.readFileSync(`dist/${slug}/index.html`, 'utf8');
          const service = fs.readFileSync('dist/polusuhaya-styazhka-omsk/index.html', 'utf8');
          const sitemap = fs.readFileSync('dist/sitemap.xml', 'utf8');
          const landing = fs.readFileSync('src/pages/SeoLandingPage.tsx', 'utf8');
          const visual = fs.readFileSync('src/components/ScreedComparisonGuide.tsx', 'utf8');
          const screed = JSON.parse(fs.readFileSync('src/data/seo-page-guides-screed.json', 'utf8'));
          const materials = fs.readFileSync('dist/guides/remont/gipsovaya-ili-tsementnaya-shtukaturka/index.html', 'utf8');
          assert.equal(screed.filter(p => p.slug === slug).length, 1, 'One existing S01 page');
          assert.match(html, /<h1>Полусухая или мокрая стяжка/);
          assert.match(html, /Визуальное сравнение полусухой и мокрой стяжки/);
          assert.match(html, /Критерии выбора стяжки/);
          assert.match(html, /Условная схема слоёв/);
          assert.match(html, /Вопросы|Частые вопросы/);
          assert.match(html, /rel="canonical" href="https:\/\/conradipui-glitch.github.io\/silalesa\/guides\/remont\/polusuhaya-ili-mokraya-styazhka\/"/);
          assert.ok(sitemap.includes(`${slug}/`), 'S01 remains in sitemap');
          assert.ok(service.includes(`${slug}/`), 'Existing reciprocal link remains');
          assert.ok(materials.includes('Гипсовая или цементная штукатурка'), 'P02 remains published');
          assert.ok(landing.includes('isScreedGuide && <ScreedComparisonGuide />'), 'Visual mounted only for S01');
          for (const text of ['useState', 'floorAdvice', 'finishChecks', 'aria-live="polite"', 's01-floor', 's01-access', 's01-finish', 'min-h-12', 'Условный разрез пола', 'Полусухая стяжка', 'Мокрая стяжка']) {
            assert.ok(visual.includes(text), `Missing UI or accessibility marker: ${text}`);
          }
          for (const forbidden of ['гарантированно быстрее', 'всегда дешевле', 'готова за 24 часа']) {
            assert.ok(!visual.includes(forbidden), `Unverified promise: ${forbidden}`);
          }
          console.log('S01 content, diagrams, selectors, accessible labels, canonical, sitemap, links and P02: PASS');
          JS
      - name: Check scope and commit tested source changes
        run: |
          git diff --check
          python3 - <<'PY'
          import subprocess
          changed = set(subprocess.check_output(['git','diff','--name-only'], text=True).splitlines())
          expected = {'src/pages/SeoLandingPage.tsx','scripts/prerender.mjs','docs/content-research/guide-visual-standard.md','docs/MASTER-EXECUTION-PLAN.md'}
          assert changed == expected, f'Unexpected changed files: {changed ^ expected}'
          assert not any('ServicesAbout' in name or 'serviceMedia' in name or 'BeforeAfter' in name for name in changed)
          print('Scoped source changes only:', ', '.join(sorted(changed)))
          PY
          git add src/pages/SeoLandingPage.tsx scripts/prerender.mjs docs/content-research/guide-visual-standard.md docs/MASTER-EXECUTION-PLAN.md
          git diff --cached --check
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'feat: integrate S01 comparison diagram and condition selector'
          git push origin HEAD:${GITHUB_REF_NAME}
