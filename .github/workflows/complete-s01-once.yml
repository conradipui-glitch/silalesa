name: One-time S01 guide integration
on:
  push:
    branches: [main]
    paths: ['.github/workflows/complete-s01-once.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Integrate S01 without touching homepage media
        run: python3 scripts/.complete-s01-once.py
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build site and all prerendered pages
        run: npm run build
      - name: Validate canonical, content, links, sitemap and planner
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import csv, json
          root = Path('dist')
          slug = 'guides/remont/polusuhaya-ili-mokraya-styazhka'
          url = 'https://conradipui-glitch.github.io/silalesa/' + slug + '/'
          guide = (root / slug / 'index.html').read_text(encoding='utf-8')
          service = (root / 'polusuhaya-styazhka-omsk' / 'index.html').read_text(encoding='utf-8')
          sitemap = (root / 'sitemap.xml').read_text(encoding='utf-8')
          llms = (root / 'llms.txt').read_text(encoding='utf-8')
          assert url in guide and url in sitemap and url in llms
          assert 'Полусухая или мокрая стяжка' in guide
          assert 'Смотреть готовые бани' not in guide
          assert 'polusuhaya-styazhka-omsk/' in guide
          assert url in service
          planner = json.loads(Path('research/yaai/planners/silalesa.json').read_text(encoding='utf-8'))
          targets = [p for p in planner['targets'] if 'S01' in p.get('intentIds', [])]
          assert len(targets) == 1 and targets[0]['status'] == 'existing' and targets[0]['path'] == '/' + slug + '/'
          with Path('docs/content-research/content-intents.csv').open(encoding='utf-8-sig', newline='') as f:
            rows = list(csv.DictReader(f))
          assert len(rows) == 36
          assert next(r for r in rows if r['intent_id'] == 'S01')['publication_status'] == 'published'
          print('S01_SMOKE_OK: static page, canonical, navigation, sitemap, llms, planner, 36 intents')
          PY
      - name: Commit reviewed changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/seoPages.ts src/pages/SeoLandingPage.tsx scripts/prerender.mjs research/yaai/planners/silalesa.json docs/content-research/content-intents.csv docs/MASTER-EXECUTION-PLAN.md
          git diff --cached --check
          git diff --cached --stat
          git commit -m 'content: publish S01 semi-dry vs wet screed guide'
          git push origin HEAD:main
