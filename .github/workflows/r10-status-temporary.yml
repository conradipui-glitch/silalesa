name: Record R10 automated publication

on:
  push:
    branches: ["revision/r10-record-automated-status"]
    paths: [".github/workflows/r10-status-temporary.yml"]

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Update only verified status; keep human sign-off open
        run: |
          python3 - <<'PY'
          from pathlib import Path
          plan=Path('docs/CONTENT-CONVERSION-REVISION-PLAN.md')
          s=plan.read_text(encoding='utf-8')
          before='| **R10** | **Итоговая приёмка всего сайта**: 22 маршрута + legacy, печатные списки, общие шаблоны, JS/без JS, SEO, ссылки | Матрица покрытия 100%; поиск повторов и противоречий после объединения PR; контрольная проверка исходных фактов, CTA и доступности, метаданных и опубликованных URL. Это ревизия, а не отдельная волна переписывания ради переписывания. | ☐ План |'
          after=before.replace('☐ План','◐ Автоматическая часть опубликована · PR #37: R1–R10 и CI успешны, Pages build/deploy #35649384234, постдеплойная HTTP-проверка #35649466091 (34 адреса, 0 ошибок). Ручная mobile/desktop/клавиатурная проверка, отправка WhatsApp, факты владельца и аудит зависимостей остаются открыты; полная приёмка не закрыта')
          if s.count(before)!=1: raise RuntimeError('Unexpected R10 master plan row')
          plan.write_text(s.replace(before,after),encoding='utf-8')
          report=Path('docs/R10-ACCEPTANCE-REPORT.md')
          s=report.read_text(encoding='utf-8')
          before='- После публикации R10 отдельный workflow `.github/workflows/post-deploy-smoke.yml` повторяет HTTP-проверки по завершении успешного GitHub Pages deployment. Его прохождение для финального SHA нужно подтвердить отдельно после слияния PR.'
          after='- PR #37 опубликован: основной коммит `cce336fa13e0702c1be6cb0fa270eb8455a4012e`; CI run `35649384299` успешен; GitHub Pages run `35649384234` собрал и развернул сайт; post-deploy smoke run `35649466091` проверил уже эту опубликованную версию (34 URL, ноль ошибок). `.github/workflows/post-deploy-smoke.yml` повторяет проверку после будущих успешных публикаций.'
          if s.count(before)!=1: raise RuntimeError('Expected pre-release report status missing')
          report.write_text(s.replace(before,after),encoding='utf-8')
          PY
      - name: Confirm documentation cannot break the build
        run: |
          npm ci
          npm run build
      - name: Keep only status documentation
        run: |
          git rm -f .github/workflows/r10-status-temporary.yml
          git add docs/CONTENT-CONVERSION-REVISION-PLAN.md docs/R10-ACCEPTANCE-REPORT.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'Docs: mark R10 automated acceptance published, human checks pending'
          git push origin HEAD:revision/r10-record-automated-status
