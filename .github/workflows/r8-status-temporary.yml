name: Record R8 published status

on:
  push:
    branches: ["revision/r8-published-status"]
    paths:
      - ".github/workflows/r8-status-temporary.yml"

permissions:
  contents: write

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record verified technical publication without claiming manual acceptance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/CONTENT-CONVERSION-REVISION-PLAN.md')
          original = p.read_text(encoding='utf-8')
          lines = original.splitlines(keepends=True)
          rows = [i for i, line in enumerate(lines) if line.startswith('| **R8** |')]
          if len(rows) != 1:
              raise RuntimeError('R8 plan row absent or duplicated')
          i = rows[0]
          old = '| ☐ План |'
          new = '| ☑ Техническая реализация опубликована · PR #33; проверки R1–R8, TypeScript, CI и GitHub Pages build/deploy успешны. Ручной просмотр mobile/desktop, проверка публичных HTTP-ответов и фактическая отправка WhatsApp остаются пунктами итоговой приёмки |'
          if lines[i].count(old) != 1:
              raise RuntimeError('R8 must still be marked planned prior to successful publication')
          lines[i] = lines[i].replace(old,new)
          p.write_text(''.join(lines), encoding='utf-8')
          print('R8 plan status: technically published after successful Pages run 35643575464')
          PY
      - name: Commit status only and delete temporary workflow
        run: |
          git rm .github/workflows/r8-status-temporary.yml
          git add docs/CONTENT-CONVERSION-REVISION-PLAN.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'Docs: record R8 published, retain manual acceptance tasks'
          git push origin HEAD:revision/r8-published-status
