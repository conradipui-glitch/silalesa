name: Polish R9 first-screen interaction

on:
  push:
    branches: ["revision/r9-configurator-quiz"]
    paths: [".github/workflows/r9-polish-temporary.yml"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Put model selector beside quote and adjust progress
        run: python3 scripts/polish-r9-temporary.py
      - name: Install locked dependencies
        run: npm ci
      - name: Run complete R1-R9 build and regression suite
        run: npm run build
      - name: Keep verified source and remove temporary helpers
        run: |
          git rm -f .github/workflows/r9-polish-temporary.yml scripts/polish-r9-temporary.py
          git add src/sections/Configurator.tsx src/sections/Quiz.tsx
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'R9: keep model selector and quick contact beside mobile quote'
          git push origin HEAD:revision/r9-configurator-quiz
