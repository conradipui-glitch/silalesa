name: Retry R10 unified audit

on:
  push:
    branches: ["revision/r10-final-acceptance"]
    paths: [".github/workflows/r10-retry-temporary.yml"]

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Include the R3 runtime overrides in final parity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/check-r10.mjs')
          s=p.read_text()
          old="'seo-page-overrides.json', 'seo-page-overrides-next.json', 'seo-page-overrides-r4.json',"
          new="'seo-page-overrides.json', 'seo-page-overrides-next.json', 'seo-page-overrides-r3.json', 'seo-page-overrides-r4.json',"
          if s.count(old)!=1: raise RuntimeError('R10 audit source unexpectedly changed')
          p.write_text(s.replace(old,new))
          PY
      - name: Build and check R1-R10
        run: |
          npm ci
          npm run build
          node scripts/check-r10.mjs
      - name: Public HTTP smoke of all canonical and legacy URLs
        run: |
          python3 - <<'PY'
          import urllib.request, pathlib, re, json
          base='https://conradipui-glitch.github.io/silalesa/'
          urls=re.findall(r'<loc>(.*?)</loc>',pathlib.Path('dist/sitemap.xml').read_text())
          products=pathlib.Path('src/data/seo-pages.json').read_text()
          ids=re.findall(r'"productId": "(\d+)"',products)
          urls.extend(base+'product/'+x+'/' for x in ids)
          urls.extend([base+'guides/bani/chek-list-priemki-gotovoy-bani/print/',base+'robots.txt',base+'sitemap.xml',base+'llms.txt'])
          results=[]
          for url in urls:
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (Silalesa R10 acceptance)'})
              with urllib.request.urlopen(req,timeout=15) as response:
                body=response.read(100000).decode('utf-8','replace')
                results.append({'url':url,'http':response.status,'prerendered':'data-prerendered="true"' in body,'hasCanonical':'rel="canonical"' in body})
            except Exception as exc:
              results.append({'url':url,'error':str(exc)})
          for result in results: print(json.dumps(result,ensure_ascii=False))
          failures=[r for r in results if 'http' in r and r['http']!=200]
          unavailable=[r for r in results if 'error' in r]
          print('HTTP_SUMMARY',json.dumps({'tested':len(urls),'http200':sum(r.get('http')==200 for r in results),'unavailable':len(unavailable),'non200':len(failures),'canonicalRendered':sum(r['prerendered'] for r in results[:22] if 'prerendered' in r)},ensure_ascii=False))
          if failures: raise SystemExit('Live HTTP non-200 responses detected')
          PY
      - name: Save audited code without temporary workflows
        run: |
          git rm -f .github/workflows/r10-audit-temporary.yml .github/workflows/r10-retry-temporary.yml
          git add scripts/check-r10.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'R10: match all runtime overrides in cross-site audit'
          git push origin HEAD:revision/r10-final-acceptance
