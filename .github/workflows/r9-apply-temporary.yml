name: Apply and verify R9 configurator and quiz

on:
  push:
    branches: ["revision/r9-configurator-quiz"]
    paths: [".github/workflows/r9-apply-temporary.yml"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded R9 implementation
        run: |
          python3 scripts/apply-r9-temporary.py
          python3 scripts/finalize-r9-temporary.py
          python3 - <<'PY'
          from pathlib import Path
          package = Path('package.json')
          original = package.read_text(encoding='utf-8')
          old = '&& node scripts/check-r8.mjs",'
          if original.count(old) != 1:
              raise RuntimeError('Cannot add unique permanent R9 regression')
          package.write_text(original.replace(old, '&& node scripts/check-r8.mjs && node scripts/check-r9.mjs",'), encoding='utf-8')
          PY
      - name: Install locked dependencies
        run: npm ci
      - name: TypeScript, production build, SEO and R1–R9 scenarios
        run: npm run build
      - name: Keep only fully verified implementation
        run: |
          git rm -f scripts/apply-r9-temporary.py scripts/finalize-r9-temporary.py .github/workflows/r9-apply-temporary.yml
          git add src/sections/Configurator.tsx src/sections/Quiz.tsx scripts/check-r9.mjs package.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'R9: immediate price and two-step fit, honest freight quote and actionable no-match'
          git push origin HEAD:revision/r9-configurator-quiz
