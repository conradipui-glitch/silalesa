name: R10 diagnostics temporary
on:
  push:
    branches: [fix/r10-security-speed-images]
    paths:
      - '.github/workflows/r10-diagnostics-temporary.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'src/**'
      - 'scripts/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and security gate
        run: |
          npm ci
          npm audit --audit-level=low
      - name: Convert remaining served JPEGs with quality gate
        run: |
          python -m pip install --quiet Pillow==11.3.0
          python scripts/convert-shipped-jpegs.py
          python scripts/convert-shipped-jpegs.py --apply
          git status --short
      - name: Full build and bundle size measurement
        env:
          GITHUB_PAGES: 'true'
        run: |
          npm run build > /tmp/build-log 2>&1 || { tail -120 /tmp/build-log; exit 1; }
          grep -E 'kB|warning|R10 PASS|R10 PERFORMANCE|ROUTE MANIFEST' /tmp/build-log | tail -55 || true
      - name: Commit only validated conversions
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/products.ts src/assets/img/interior-parnaya.webp src/assets/img/interior-otdyh.webp src/assets/img/winter.webp
          if ! git diff --staged --quiet; then
            git commit -m 'perf(r10): serve source-faithful WebP interior and winter photos'
            git push origin HEAD:fix/r10-security-speed-images
          fi
