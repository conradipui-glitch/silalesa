name: R10 diagnostics temporary
on:
  push:
    branches: [fix/r10-security-speed-images]
    paths:
      - '.github/workflows/r10-diagnostics-temporary.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'src/**'
      - 'scripts/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install and security gate
        run: |
          npm ci
          npm audit --audit-level=low
      - name: Generate slim route manifest and inspect dependents
        run: |
          node scripts/generate-route-manifest.mjs --write
          git grep -n -E 'seoPages|seoSlugs|seoPageBySlug' -- src || true
          cat src/data/routeManifest.ts
      - name: Commit generated manifest
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/data/routeManifest.ts
          if ! git diff --staged --quiet; then
            git commit -m 'perf(r10): add checked lightweight routing registry'
            git push origin HEAD:fix/r10-security-speed-images
          fi
