name: Apply R4.1 buyer-first plaster guide

on:
  push:
    branches: ["docs/p01-ux-acceptance-r4a"]
    paths: [".github/workflows/r41-apply.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout R4.1 working branch
        uses: actions/checkout@v4
        with:
          ref: docs/p01-ux-acceptance-r4a
          persist-credentials: true
      - name: Patch P01 hero and no-JS, update old R1 regression and build gate
        run: python3 scripts/r41-edit-temporary.py
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify full build with R1-R4.1 regressions
        run: npm run build
      - name: Commit finished code, audit and checks without temporary helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/SeoLandingPage.tsx scripts/prerender.mjs scripts/check-r1.mjs package.json
          git rm scripts/r41-edit-temporary.py .github/workflows/r41-apply.yml
          git commit -m "R4.1: show price and contact immediately; validate simple buyer flow"
          git push origin HEAD:docs/p01-ux-acceptance-r4a
