name: Record R5 published status
on:
  push:
    branches: [docs/r5-published-status]
    paths: ['.github/workflows/r5-status-temporary.yml']
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update R5 status from verified publication
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/CONTENT-CONVERSION-REVISION-PLAN.md')
          content = path.read_text()
          matches = [line for line in content.splitlines() if line.startswith('| **R5** |')]
          assert len(matches) == 1, 'Unique R5 row required'
          old = matches[0]
          assert '| ☐ План |' in old, 'R5 should currently be planned'
          new = old.replace('| ☐ План |', '| ☑ Реализация опубликована · PR #27; проверки R1–R5, CI и Pages успешны. Ручной мобильный/десктопный просмотр и фактическая отправка WhatsApp не проверены |')
          content = content.replace(old, new)
          assert content.count(new) == 1
          path.write_text(content)
          PY
      - name: Commit only corrected plan and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/r5-status-temporary.yml
          git add docs/CONTENT-CONVERSION-REVISION-PLAN.md
          git commit -m 'Docs: record R5 publication and separate manual acceptance'
          git push origin HEAD:docs/r5-published-status