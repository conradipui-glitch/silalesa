name: Apply and verify R6 operational guides

on:
  push:
    branches: ["revision/r6-operational-guides"]
    paths:
      - ".github/workflows/r6-apply-temporary.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Integrate guarded changes
        run: python3 scripts/apply-r6-temporary.py
      - name: Match detailed-guide assertion to source content
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/check-r6.mjs')
          text = path.read_text(encoding='utf-8')
          old = "  assert(html.includes('<details><summary>Подробные инструкции и безопасность</summary>'), 'Detailed safety information optional in static HTML');"
          new = "  if (original.sections?.length) assert(html.includes('<details><summary>Подробные инструкции и безопасность</summary>'), 'Existing detailed safety information optional in static HTML');"
          assert text.count(old) == 1, 'Expected one safety assertion'
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build and verify R1 through R6
        run: npm run build
      - name: Commit verified changes without temporary helpers
        run: |
          git rm -f scripts/apply-r6-temporary.py .github/workflows/r6-apply-temporary.yml
          git add src/data/seoPages.ts src/pages/SeoLandingPage.tsx src/components/OperationalGuide.tsx scripts/prerender.mjs scripts/check-r1.mjs scripts/check-r6.mjs package.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'R6: integrate operational guides with runtime, static SEO and full regression'
          git push origin HEAD:revision/r6-operational-guides
