name: Cleanup visualization labels

on:
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/cleanup-visualization.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove prototype visualization labels
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          changed = []
          for path in Path("src").rglob("*"):
              if path.suffix not in {".ts", ".tsx", ".html"}:
                  continue
              text = path.read_text(encoding="utf-8")
              before = text
              # Remove visible pill/badge elements whose only content is "Визуализация".
              text = re.sub(
                  r'\n?\s*<span\s+className="[^"]*">\s*Визуализация\s*</span>',
                  '',
                  text,
              )
              # Alt text should describe the scene, not editorialize about how it was made.
              text = text.replace("Визуализация ", "")
              text = text.replace("Визуализация", "")
              # Guard against a stale prototype disclaimer ever being left behind.
              text = text.replace(
                  "Часть атмосферных изображений — художественные визуализации. Реальные образцы можно посмотреть на площадке.",
                  "",
              )
              text = text.replace(
                  "Часть атмосферных изображений — художественные визуализации. Реальные образцы можно посмотреть на площадке и в группе ВКонтакте.",
                  "",
              )
              if text != before:
                  path.write_text(text, encoding="utf-8")
                  changed.append(str(path))

          print("Changed files:")
          print("\n".join(changed) if changed else "none")
          PY

      - name: Commit cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          if ! git diff --cached --quiet; then
            git commit -m "fix: remove prototype visualization labels"
            git push
          fi
