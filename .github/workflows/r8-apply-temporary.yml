name: Apply and verify R8 homepage

on:
  push:
    branches: ["revision/r8-home-buyers-journey"]
    paths:
      - ".github/workflows/r8-apply-temporary.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Remove redundant one-off assertion from staging script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply-r8-temporary.py')
          lines = p.read_text(encoding='utf-8').splitlines(keepends=True)
          discard = [line for line in lines if line.startswith('patch(trust,') and 'expected=2' in line]
          if len(discard) != 1 or 'divide-y' not in discard[0]:
              raise RuntimeError('Expected one redundant trust no-op line')
          p.write_text(''.join(line for line in lines if line not in discard), encoding='utf-8')
          PY
      - name: Apply home and shared-navigation patches
        run: python3 scripts/apply-r8-temporary.py
      - name: Finalize imports and permanent R8 build gate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          modifications = [
              ('src/sections/Story.tsx', 'import { company, images, mapsUrl } from "../data/products";', 'import { images } from "../data/products";'),
              ('package.json', '&& node scripts/check-r7.mjs",', '&& node scripts/check-r7.mjs && node scripts/check-r8.mjs",'),
          ]
          for filename, old, new in modifications:
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise RuntimeError(f'Expected exactly one occurrence in {filename}: {old}')
              path.write_text(text.replace(old,new), encoding='utf-8')
          PY
      - name: Install dependencies
        run: npm ci
      - name: Build and test R1 through R8
        run: npm run build
      - name: Commit verified implementation, discard workflow
        run: |
          git rm -f scripts/apply-r8-temporary.py .github/workflows/r8-apply-temporary.yml
          git add src/sections/Hero.tsx src/sections/Models.tsx src/sections/Story.tsx src/sections/Trust.tsx src/sections/ServicesAbout.tsx src/components/Brand.tsx src/App.tsx scripts/prerender.mjs index.html package.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --check
          git commit -m 'R8: source-backed home journey and useful mobile contact without JS dependency'
          git push origin HEAD:revision/r8-home-buyers-journey
