name: R2 demonstration isolation verification

on:
  push:
    branches: ["revision/r2-p01-interactives"]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply narrowly scoped safety fix
        run: node scripts/r2-isolate-example.mjs
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Pages-mode build
        run: GITHUB_PAGES=true npm run build
      - name: Regression, logic and diff checks
        run: |
          node scripts/check-r1.mjs
          node scripts/check-r2.mjs
          git diff --check
      - name: Commit tested source, remove temporary tooling
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm scripts/r2-isolate-example.mjs .github/workflows/r2-demo-verify.yml
          git add -A
          git diff --cached --check
          git commit -m 'fix(r2): keep hypothetical demo separate from customer estimates'
          git push
