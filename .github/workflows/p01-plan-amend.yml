name: Amend P01 UX revision plan

on:
  push:
    branches: ["docs/p01-ux-acceptance-r4a"]
    paths: [".github/workflows/p01-plan-amend.yml"]

permissions:
  contents: write

jobs:
  amend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plan branch
        uses: actions/checkout@v4
        with:
          ref: docs/p01-ux-acceptance-r4a
          persist-credentials: true
      - name: Record customer feedback and explicit corrective iteration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/CONTENT-CONVERSION-REVISION-PLAN.md')
          s = p.read_text(encoding='utf-8')
          def once(old, new):
              global s
              if s.count(old) != 1:
                  raise ValueError(f'Expected unique marker {old[:90]!r}, got {s.count(old)}')
              s = s.replace(old, new, 1)
          once('Статус: **правила утверждены; R1–R3 опубликованы, следующие итерации — по плану**.', 'Статус: **R1–R4 опубликованы; перед R5 добавлена корректирующая R4.1 по замечаниям посетителя о сложности P01**.')
          once('## 4. Очередь: девять реализационных итераций + итоговая приёмка', '## 4. Очередь: R1–R9, корректирующая R4.1 и итоговая приёмка R10')
          once('Замена четырёх фотографий бань — отдельный незакрытый запрос;', 'Четыре фотографии бань отдельно опубликованы в PR #21;')
          once('| **R4** | Три услуги: **штукатурка, стяжка, бурение**, плюс `/services/` | Единая логика оффера: для кого, что получает клиент, известный ценовой ориентир с единицами, что нужно для расчёта, реальные преимущества и простая заявка. Согласованность с гайдами, без неоговорённых «под ключ»/гарантий. | ☐ План |', '| **R4** | Три услуги: **штукатурка, стяжка, бурение**, плюс `/services/` | Единая логика оффера: для кого, что получает клиент, известный ценовой ориентир с единицами, что нужно для расчёта, реальные преимущества и простая заявка. Согласованность с гайдами, без неоговорённых «под ключ»/гарантий. | ☑ Выполнено · PR #22; CI и Pages build/deploy успешны. Ручной мобильный просмотр и отправка WhatsApp не проверены |\n| **R4.1** | **Коррекция UX гайда P01** «Механизированная или ручная штукатурка» и точечный аудит перегруза P02/S01/S04 | Убрать из основного пути две тяжёлые панели с 5 этапами и 8×2 полями. Сначала простой ответ, практические отличия, цена и обращение; затем необязательный короткий чек-лист сметы, подробности только по запросу. Проверка на обычном посетителе, mobile, JS/no-JS и работающих CTA. Менять другие гайды только при выявленном перегрузе. | ☐ Обязательная корректировка **перед R5**; прежние R1/R2 технически опубликованы, но замечание посетителя по понятности не закрыто |')
          once('Выполнять **R1 → R10**;', 'Выполнять **R1 → R10**, обязательно вставив **R4.1 между R4 и R5**;')
          insertion = '''### R4.1 — обязательный критерий понятности, а не повторная косметика

**Причина:** отзыв после R4: на информационной странице P01 посетитель видит «Что общее / где разница», пять технических этапов, затем одну/две сметы с повторяющимися «Надо уточнить» для механизированной и ручной штукатурки. Фактически это не расчёт цены; 8 строк выпадающих списков и прогресс от нуля выглядят как обязательная сложная анкета. Формальное закрытие R1/R2 означало техническую реализацию и тесты, но не подтверждённую понятность для покупателя. Нельзя переносить замечание только в итоговую R10.

**Два разных URL:** `/mehanizirovannaya-shtukaturka-omsk/` — коммерческая страница, её оффер/цены уже обновлены в R4; `/guides/remont/mehanizirovannaya-ili-ruchnaya-shtukaturka/` — сравнительный гайд P01, которому нужна отдельная коррекция. Не превращать гайд в копию страницы услуги.

1. **Первый экран гайда:** короткий человеческий ответ, чем способы отличаются для заказчика, что именно предлагает «Сила Леса», и ссылка на цену «от 550 ₽/м²» и расчёт на коммерческой странице. Читатель получает пользу без любого ввода.
2. **Вместо обязательной карты 5 этапов:** 3–4 наглядных различия/общих правила в компактных карточках; детали «Основание / Смесь / Нанесение / Выравнивание / Приёмка» оставить только если помогают, свернуть под необязательным «Как устроены работы». Избегать параллельных стен текста и технических терминов без пользы для выбора.
3. **Вместо таблицы 8×2 выпадающих списков:** сначала доступный без заполнения мини-чек-лист «что входит в цену / материалы / подготовка / доставка / результат / доплаты» и понятный итог «что спросить перед заказом». Режим сравнения двух смет и подробные позиции показывать только явно заинтересованным людям; если они не добавляют пользы, удалить. Пустое состояние — объяснение и действие, а не восемь красноречивых «Надо уточнить» и прогресс 0/8. Не называть проверку состава калькулятором стоимости и не имитировать оценку суммы без реальных данных.
4. **Путь к действию:** рядом с ответом и в финале явный CTA «Пришлите площадь и фото стен — обсудим расчёт механизированной штукатурки». Не заставлять посетителя разбираться в сметах ради отправки заявки. Не обещать неподтверждённые сроки, гарантии и конечную стоимость.
5. **Контроль похожих интерактивов P02, S01, S04:** проверить исходные экраны, количество полей и промежуточные результаты обычным пользовательским сценарием. Исправлять выявленное, не ломая полезные ответы и технику безопасности. Технические детали остаются доступными добровольно.
6. **Приёмка:** посетитель за 5–10 секунд без кликов видит ответ, ориентир цены и следующее действие; без заполнения формы может понять принцип выбора и что спросить. Проверить мобильный/десктопный показ, клавиатуру, сброс/все оставшиеся состояния, доступный статический HTML без JavaScript, мета/ссылки, отдельный корректирующий PR, CI и Pages. Ручной просмотр явно отличать от автоматического теста.

**Статус:** ☐ Не реализовано. Изменения R1/R2 оставлены опубликованными до полноценной исправляющей итерации; не объявлять повторную переделку готовой заранее.

'''
          once('## 5. Что именно вынесли из двух ревью P01', insertion + '## 5. Что именно вынесли из двух ревью P01')
          once('После R10 не должно остаться URL без ревизии, тупиковых CTA и расхождений между runtime и prerender.', 'После R10 не должно остаться URL без ревизии, тупиковых CTA и расхождений между runtime и prerender. Отдельно проверить на каждом интерактиве понятность с первого экрана, отсутствие обязательной анкеты без ранней пользы и повторяющихся «Надо уточнить» без ясного следующего действия; закрыть замечания R4.1 до R10.')
          p.write_text(s, encoding='utf-8')
          print('Plan amended: corrective R4.1, R4 published, explicit customer acceptance gate.')
          PY
      - name: Commit only the final plan document
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/p01-plan-amend.yml
          git add docs/CONTENT-CONVERSION-REVISION-PLAN.md
          git diff --cached --check
          git diff --cached --stat
          git commit -m "Plan R4.1: simplify P01 for ordinary visitors before R5"
          git push origin HEAD:docs/p01-ux-acceptance-r4a
